name: Compilar FarmBovi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React, Tailwind y PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: ASP.NET Core .NET 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: BackEnd/packages.lock.json
      - run: dotnet restore FarmBovi.sln --locked-mode
      - run: dotnet build FarmBovi.sln --configuration Release --no-restore
