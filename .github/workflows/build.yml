name: Compilar FarmBovi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: React, Tailwind y PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontEnd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: ASP.NET Core .NET 10
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: farmbovi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p'test_root_password'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            BackEnd/packages.lock.json
            BackEnd.Tests/packages.lock.json
      - run: dotnet restore FarmBovi.sln --locked-mode
      - run: dotnet build FarmBovi.sln --configuration Release --no-restore
      - name: Ejecutar pruebas xUnit e integración MySQL real
        env:
          FARMBOVI_REQUIRE_REAL_DB: "true"
          FARMBOVI_TEST_CONNECTION: "Server=127.0.0.1;Port=3306;Database=farmbovi;User ID=root;Password=test_root_password;"
        run: dotnet test FarmBovi.sln --configuration Release --no-build --verbosity normal

  backend-mariadb:
    name: ASP.NET Core .NET 10 (MariaDB 11)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test_root_password
          MARIADB_DATABASE: farmbovi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            BackEnd/packages.lock.json
            BackEnd.Tests/packages.lock.json
      - run: dotnet restore FarmBovi.sln --locked-mode
      - run: dotnet build FarmBovi.sln --configuration Release --no-restore
      - name: Ejecutar pruebas xUnit e integración MariaDB real
        env:
          FARMBOVI_REQUIRE_REAL_DB: "true"
          FARMBOVI_TEST_CONNECTION: "Server=127.0.0.1;Port=3306;Database=farmbovi;User ID=root;Password=test_root_password;"
        run: dotnet test FarmBovi.sln --configuration Release --no-build --verbosity normal
